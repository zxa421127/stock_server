# StockData production Nginx template.
# Replace api.example.com, admin-api.example.com, certificate paths, and the
# administrator proxy secret before enabling this file.

limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=user_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=user_register:10m rate=5r/h;
limit_req_zone $binary_remote_addr zone=password_reset:10m rate=5r/h;
limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;

upstream stock_server_backend {
    server 127.0.0.1:8899;
    keepalive 32;
}

# Public API and normal-user site. Administrator paths are deliberately hidden
# here so browsers are never asked for a client certificate on the public host.
server {
    listen 443 ssl http2;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    # Never allow callers to smuggle certificate-verification headers through
    # the public virtual host.
    proxy_set_header X-Admin-Proxy-Auth "";
    proxy_set_header X-Admin-Client-Cert-Verify "";
    proxy_set_header X-Admin-Client-Cert "";
    proxy_set_header X-Admin-Client-Cert-Fingerprint "";
    proxy_set_header X-Admin-Client-Cert-Serial "";
    proxy_set_header X-Admin-Client-Cert-Subject "";

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = /user/login {
        limit_req zone=user_login burst=5 nodelay;
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/register {
        limit_req zone=user_register burst=2 nodelay;
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/forgot-password {
        limit_req zone=password_reset burst=2 nodelay;
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        gzip on;
        gzip_types application/json text/csv;
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Dedicated administrator host. TLS client-certificate verification occurs
# before Flask sees the request. The proxy secret must exactly match
# ADMIN_CLIENT_CERT_PROXY_SECRET in the application's .env.
server {
    listen 443 ssl http2;
    server_name admin-api.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/admin-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_client_certificate /etc/stock-server/pki/admin-client-ca.crt.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    # Overwrite all protected headers; never append values supplied by clients.
    proxy_set_header X-Admin-Proxy-Auth "REPLACE_WITH_ADMIN_CLIENT_CERT_PROXY_SECRET";
    proxy_set_header X-Admin-Client-Cert-Verify $ssl_client_verify;
    proxy_set_header X-Admin-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header X-Admin-Client-Cert-Fingerprint $ssl_client_fingerprint;
    proxy_set_header X-Admin-Client-Cert-Serial $ssl_client_serial;
    proxy_set_header X-Admin-Client-Cert-Subject $ssl_client_s_dn;

    location = / {
        return 302 /admin/login;
    }

    location = /admin/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin/ {
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /static/ {
        proxy_pass http://stock_server_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.example.com admin-api.example.com;
    return 301 https://$host$request_uri;
}
