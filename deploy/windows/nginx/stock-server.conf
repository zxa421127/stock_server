# Windows Nginx production template for StockData.
# Copy to C:/stockdata/nginx/conf/nginx.conf and replace every REPLACE_* value.
# Backend Waitress must listen only on 127.0.0.1:8899.

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=user_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=user_register:10m rate=5r/h;
    limit_req_zone $binary_remote_addr zone=password_reset:10m rate=5r/h;
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;

    upstream stock_server_backend {
        server 127.0.0.1:8899;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Public API and normal-user site. Administrator paths are not exposed here.
    server {
        listen 443 ssl;
        server_name REPLACE_PUBLIC_API_HOST;

        ssl_certificate C:/stockdata/nginx/certs/public/fullchain.pem;
        ssl_certificate_key C:/stockdata/nginx/certs/public/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;

        # Strip all trusted administrator headers supplied by an external caller.
        proxy_set_header X-Admin-Proxy-Auth "";
        proxy_set_header X-Admin-Client-Cert-Verify "";
        proxy_set_header X-Admin-Client-Cert "";
        proxy_set_header X-Admin-Client-Cert-Fingerprint "";
        proxy_set_header X-Admin-Client-Cert-Serial "";
        proxy_set_header X-Admin-Client-Cert-Subject "";

        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }

        location = /user/login {
            limit_req zone=user_login burst=5 nodelay;
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /user/register {
            limit_req zone=user_register burst=2 nodelay;
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /user/forgot-password {
            limit_req zone=password_reset burst=2 nodelay;
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 128k;
            gzip on;
            gzip_types application/json text/csv;
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Dedicated administrator host. Client certificates are required at TLS.
    server {
        listen 443 ssl;
        server_name REPLACE_ADMIN_HOST;

        ssl_certificate C:/stockdata/nginx/certs/admin/fullchain.pem;
        ssl_certificate_key C:/stockdata/nginx/certs/admin/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_client_certificate C:/stockdata/nginx/certs/admin-client-ca.crt.pem;
        ssl_verify_client on;
        ssl_verify_depth 1;

        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;

        # These values overwrite any client-supplied headers.
        proxy_set_header X-Admin-Proxy-Auth "REPLACE_ADMIN_PROXY_SECRET";
        proxy_set_header X-Admin-Client-Cert-Verify $ssl_client_verify;
        proxy_set_header X-Admin-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Admin-Client-Cert-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Admin-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Admin-Client-Cert-Subject $ssl_client_s_dn;

        location = / {
            return 302 /admin/login;
        }

        location = /admin/login {
            limit_req zone=admin_login burst=3 nodelay;
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /admin/ {
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /static/ {
            proxy_pass http://stock_server_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / { return 404; }
    }

    server {
        listen 80;
        server_name REPLACE_PUBLIC_API_HOST REPLACE_ADMIN_HOST;
        return 301 https://$host$request_uri;
    }
}
